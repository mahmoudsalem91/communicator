<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#3ecf8e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b2a4a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#shine)"/>

  <!-- Voice waveform -->
  <g fill="#ffffff" filter="url(#shadow)">
    <rect x="148" y="402" width="104" height="220" rx="52"/>
    <rect x="304" y="292" width="104" height="440" rx="52"/>
    <rect x="460" y="212" width="104" height="600" rx="52"/>
    <rect x="616" y="322" width="104" height="380" rx="52"/>
    <rect x="772" y="422" width="104" height="180" rx="52"/>
  </g>
</svg>
